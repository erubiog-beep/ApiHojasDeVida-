<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Administrar experiencias | Hojas de Vida</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 960px;">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h1 class="h3 m-0">Administrar experiencias profesionales</h1>
    <a class="btn btn-outline-secondary btn-sm" href="/api-docs" target="_blank">Ver Swagger</a>
  </div>

  <div class="card mb-4"><div class="card-body">
    <h2 class="h5" id="titulo-form">Nueva experiencia</h2>
    <div id="alerta" class="alert d-none" role="alert"></div>
    <div id="form-exp" class="row g-3">
      <input type="hidden" id="id">
      <div class="col-md-4"><label class="form-label" for="persona">Hoja de vida</label>
        <select id="persona" class="form-select">
          <option value="emuar">Emuar</option><option value="laura">Laura</option><option value="fabian">Fabián</option>
        </select></div>
      <div class="col-md-4"><label class="form-label" for="empresa">Empresa</label><input id="empresa" class="form-control"></div>
      <div class="col-md-4"><label class="form-label" for="cargo">Cargo</label><input id="cargo" class="form-control"></div>
      <div class="col-md-4"><label class="form-label" for="fechaInicio">Fecha de inicio</label><input id="fechaInicio" type="date" class="form-control"></div>
      <div class="col-md-4"><label class="form-label" for="fechaFin">Fecha de fin</label><input id="fechaFin" type="date" class="form-control"></div>
      <div class="col-md-4 d-flex align-items-end"><div class="form-check"><input id="actual" type="checkbox" class="form-check-input"><label class="form-check-label" for="actual">Trabajo actual</label></div></div>
      <div class="col-12"><label class="form-label" for="descripcion">Descripción</label><textarea id="descripcion" rows="3" class="form-control" maxlength="600"></textarea></div>
      <div class="col-12 d-flex gap-2">
        <button id="guardar" class="btn btn-primary" type="button">Guardar</button>
        <button id="cancelar" class="btn btn-outline-secondary d-none" type="button">Cancelar edición</button>
      </div>
    </div>
  </div></div>

  <div class="d-flex align-items-center gap-2 mb-2">
    <label for="filtro" class="form-label m-0">Ver:</label>
    <select id="filtro" class="form-select form-select-sm w-auto">
      <option value="">Todas</option><option value="emuar">Emuar</option><option value="laura">Laura</option><option value="fabian">Fabián</option>
    </select>
  </div>
  <div class="table-responsive"><table class="table table-sm table-striped bg-white align-middle">
    <thead><tr><th>Persona</th><th>Empresa</th><th>Cargo</th><th>Periodo</th><th></th></tr></thead>
    <tbody id="tabla"></tbody>
  </table></div>
</div>

<script>
var API = '/api/experiencias';
var $ = function (id) { return document.getElementById(id); };
var cache = [];

function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dia(iso) { return iso ? iso.substring(0, 10) : ''; }
function alerta(msg, tipo) {
  var a = $('alerta'); a.className = 'alert alert-' + tipo; a.innerHTML = msg;
  setTimeout(function () { a.classList.add('d-none'); }, 5000);
}
function limpiar() {
  ['id','empresa','cargo','fechaInicio','fechaFin','descripcion'].forEach(function (k) { $(k).value = ''; });
  $('actual').checked = false; $('fechaFin').disabled = false;
  $('titulo-form').textContent = 'Nueva experiencia'; $('cancelar').classList.add('d-none');
}
$('actual').addEventListener('change', function () {
  $('fechaFin').disabled = this.checked; if (this.checked) $('fechaFin').value = '';
});

async function cargar() {
  var q = $('filtro').value ? '?persona=' + $('filtro').value : '';
  var r = await fetch(API + q); cache = await r.json();
  $('tabla').innerHTML = cache.length ? cache.map(function (e) {
    return '<tr><td>' + esc(e.persona) + '</td><td>' + esc(e.empresa) + '</td><td>' + esc(e.cargo) + '</td>' +
      '<td>' + dia(e.fechaInicio) + ' → ' + (e.actual ? 'actual' : dia(e.fechaFin)) + '</td>' +
      '<td class="text-end text-nowrap"><button class="btn btn-sm btn-outline-primary" data-editar="' + e._id + '">Editar</button> ' +
      '<button class="btn btn-sm btn-outline-danger" data-borrar="' + e._id + '">Eliminar</button></td></tr>';
  }).join('') : '<tr><td colspan="5" class="text-center text-muted">Sin experiencias</td></tr>';
}

$('guardar').addEventListener('click', async function () {
  var id = $('id').value;
  var datos = {
    persona: $('persona').value, empresa: $('empresa').value, cargo: $('cargo').value,
    fechaInicio: $('fechaInicio').value, actual: $('actual').checked,
    fechaFin: $('actual').checked || !$('fechaFin').value ? null : $('fechaFin').value,
    descripcion: $('descripcion').value
  };
  var r = await fetch(id ? API + '/' + id : API, {
    method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos)
  });
  var j = await r.json();
  if (!r.ok) { alerta((j.detalles || [j.error]).map(esc).join('<br>'), 'danger'); return; }
  alerta(id ? 'Experiencia actualizada' : 'Experiencia creada', 'success');
  limpiar(); cargar();
});

$('tabla').addEventListener('click', async function (ev) {
  var idE = ev.target.getAttribute('data-editar'), idB = ev.target.getAttribute('data-borrar');
  if (idE) {
    var e = cache.find(function (x) { return x._id === idE; });
    $('id').value = e._id; $('persona').value = e.persona; $('empresa').value = e.empresa; $('cargo').value = e.cargo;
    $('fechaInicio').value = dia(e.fechaInicio); $('fechaFin').value = dia(e.fechaFin);
    $('actual').checked = e.actual; $('fechaFin').disabled = e.actual; $('descripcion').value = e.descripcion || '';
    $('titulo-form').textContent = 'Editar experiencia'; $('cancelar').classList.remove('d-none');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (idB && confirm('¿Eliminar esta experiencia?')) {
    var r = await fetch(API + '/' + idB, { method: 'DELETE' });
    if (r.ok) { alerta('Experiencia eliminada', 'success'); cargar(); } else { alerta('No se pudo eliminar', 'danger'); }
  }
});
$('cancelar').addEventListener('click', limpiar);
$('filtro').addEventListener('change', cargar);
cargar();
</script>
</body>
</html>
